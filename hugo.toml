# Theme-wide defaults, merged into every site using this theme.
# Site configs can override any of these; the example site's
# 'exampleSite/hugo.toml' documents the site-side configuration.
#
[params.webmentions]
  # Webmention/pingback collector endpoint (see the theme's
  # 'services/webmentions/README.md'). When set, both the webmention and
  # the pingback endpoint are advertised in the document head; explicit
  # 'advertisePingback = false' opts out of the pingback link.
  endpoint = 'https://static.projektemacher.org/services/webmentions/webmention.php'

[mediaTypes."application/linkset+json"]
  # W3C linkset (https://www.w3.org/TR/linkset/) - the theme registers the
  # format only; the site enables it via 'outputs' and provides the page
  # template (e.g. 'layouts/home.linkset.json'). Advertisement happens via
  # '.AlternativeOutputFormats' (the format's rel value is 'linkset') - see
  # 'layouts/_partials/html/head/links.html' and
  # 'exampleSite/content/templates/linkset.md'.
  suffixes = ["json"]

[outputFormats]
  # Note: when the format is enabled but no template exists, Hugo warns
  # ("found no layout file") and skips rendering, while the head still
  # advertises the link - provide a template when enabling.
  [outputFormats.linkset]
    mediaType = "application/linkset+json"
    baseName = "linkset"
    isPlainText = true
    isHTML = false
    rel = "linkset"

[module]
  # Minimum Hugo version the theme needs (deprecated APIs are only fixed
  # for Hugo >= 0.166.0); 'theme.toml' 'min_version' carries the same
  # value for the Themes Gallery. Sites building with a lower version
  # fail with a clear error (see 'skills/hugo-upgrade/fixes.md' and 'Upgrade.md').
  [module.hugoVersion]
    min = "0.166.0"
  # Note: declaring any mount drops ALL implicit default mounts of this
  # component ('assets', 'content', 'data', 'i18n', 'layouts', 'static'),
  # so they are re-declared explicitly here - see the example site's
  # 'hugo.toml' for the same pattern.
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  # The Kasane viewer (<iiif-viewer>) injects its stylesheet at runtime via
  # 'new URL("style.css", import.meta.url)' relative to its JS bundle, so the
  # package stylesheet must be reachable as an asset and is published next to
  # the bundle ('ts/iiif/style.css') by the shortcodes using the element.
  [[module.mounts]]
    source = "node_modules/iiif-kasane/dist/style.css"
    target = "assets/ts/iiif/style.css"
