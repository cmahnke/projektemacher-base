{{- $entries := .entries -}}
<div id="timeline" class="timeline timeline-horizontal">
</div>
<script type="text/javascript">
    var issues = [
        {{- range $entries -}}
                {{- /* Front matter param holding the year, sites can override (kinderbuecher: issueYear) */ -}}
                {{- $yearKey := $.yearKey | default "year" -}}
                {{- $year := index .Params $yearKey -}}
                {{- $month := 1 -}}
                {{- if isset .Params "month" -}}
                    {{- $month = .Params.month -}}
                {{- end -}}
                {{- $content := printf "<a href=\"%s\">%s</a>" .RelPermalink .Title -}}
                {"content": "{{ $content }}", "start": new Date({{- $year -}}, {{- $month -}}, 1), "url": {{ .RelPermalink | jsonify }}},

        {{- end -}}
    ];
    var options = {};
    var timeline = addTimeline('timeline', issues, options);

    document.addEventListener("DOMContentLoaded", function() {
        if (window.innerWidth < 1024 && window.showTab) {
            window.showTab('vertical-tab')
        }
    });
</script>
