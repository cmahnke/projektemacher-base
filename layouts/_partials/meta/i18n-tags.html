{{ if isset .Params "tags" }}
  <div class="tags">
      {{ range $tag := .Params.tags }}
          {{- $tagName := i18n $tag -}}
          {{- if not $tagName -}}{{- $tagName = $tag -}}{{- end -}}
          <a href="{{ "tags/" | relLangURL }}{{ $tag | urlize }}" title="{{ $tagName }}">#{{ $tagName }}</a><br />
      {{ end }}
  </div>
{{ end }}
