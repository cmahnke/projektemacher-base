{{ $content := .RawContent }}
{{- $content = partial "macros/remove-shortcodes.txt" $content -}}
<div class="geojsonPopup">
    <div class="title">
        {{ .Title }}
    </div>
    <div class="content">
        {{ $content | markdownify }}
    </div>
    <div class="link">
        <a href="{{ .RelPermalink }}" aria-label="{{ i18n "readmore" }}: {{ .Title }}">{{ i18n "readmore" }}</a>
    </div>
</div>
