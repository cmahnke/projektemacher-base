name: Harvest webmentions

# The reusable harvest pipeline: called by the deploy workflow after a
# fresh endpoint deployment, run standalone on the hourly cron (no
# deploy) and on manual workflow_dispatch.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  # Harvest always pushes to 'main', so every harvest run (cron,
  # workflow_dispatch, and called from the deploy workflow) shares one
  # queue - the group name is static and distinct from the caller's
  # top-level group on purpose: a 'workflow_call' resolves
  # 'github.workflow' to the caller's name, and an identical group
  # string deadlocks against the caller's own hold.
  group: webmentions-harvest
  cancel-in-progress: false

permissions:
  contents: write

# Where the merged mention data is committed in this repository - the
# site's own data directory, which Hugo reads directly as build data
# ('hugo.Data.webmentions.mentions'), no fetch step needed. The theme
# repository itself collects nothing: copy this workflow and the deploy
# workflow into the site repository and keep the default
# ('data/webmentions' at the site root); adjust only if the site lives
# in a subdirectory.
# The single connection to the deployment host - harvest runs over the
# same connection the deploy workflow uses, defined here and there (see
# 'scripts/webmention/host.sh').
env:
  WEBMENTIONS_DATA_DIR: data/webmentions
  DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
  DEPLOY_PASS: ${{ secrets.DEPLOY_PASS }}

jobs:
  harvest:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Harvest collected mentions
        run: |
          ./scripts/webmention/collect.sh "$RUNNER_TEMP/webmentions-raw"

      - name: Lint and merge mentions
        run: |
          python3 scripts/webmention/lint.py \
            "$RUNNER_TEMP/webmentions-raw" \
            "$RUNNER_TEMP/mentions.json"

      - name: Commit to the main data directory
        run: |
          mkdir -p "$WEBMENTIONS_DATA_DIR"
          cp "$RUNNER_TEMP/mentions.json" "$WEBMENTIONS_DATA_DIR/mentions.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No mention changes, nothing to commit"
            exit 0
          fi
          git commit -m "Webmention update $(date -u '+%Y-%m-%dT%H:%M:%SZ') [skip ci]"
          for ATTEMPT in 1 2 3 ; do
            if git push origin main; then
              exit 0
            fi
            # main moved since the checkout - replay the data commit on
            # top of it ('-X theirs' keeps the fresh harvest on a
            # racing data file change).
            if ! git rebase --quiet -X theirs origin/main; then
              echo "Rebase onto moved main failed" >&2
              exit 1
            fi
          done
          echo "Could not push the mention update" >&2
          exit 1
