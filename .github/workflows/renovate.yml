name: Renovate
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.9
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: 'info'
          autodiscover: 'true'
          autodiscover-filter: 'cmahnke/projektemacher-base,cmahnke/backsteinexpressionismus,cmahnke/briefsteller,cmahnke/christianmahnke,cmahnke/diapraesentation,cmahnke/flohmarktfunde,cmahnke/flugzeugbesteck,cmahnke/haesslicheplastiktiereundzeugs,cmahnke/kinderbuecher,cmahnke/kleiderbuegel,cmahnke/kraehenbeisser,cmahnke/labs.projektemacher.org,cmahnke/merch.projektemacher,cmahnke/never-built,cmahnke/plastikwarenfabrik,cmahnke/projektemacher,cmahnke/ric-unknownartist,cmahnke/schatten,cmahnke/schriftmuster,cmahnke/vintagereality,cmahnke/vorsatzpapier,cmahnke/wilmabraeuner,cmahnke/xn--h-zfa.xyz,cmahnke/yaapb'
