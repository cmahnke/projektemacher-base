baseURL = 'https://cmahnke.github.io/projektemacher-base/'
theme = ["projektemacher-base"]
title = "Projektemacher Theme"
locale = "en"
defaultContentLanguage = "en"
publishDir = "docs"
canonifyURLs = true
disablePathToLower = true

[params]
  description = 'Demo and documentation site for the Projektemacher Base theme'
  keywords = 'hugo, theme, IIIF, documentation'
  copyrightYears = '2022 - 2026'
  # Location of the pagefind search index bundle, read by the theme's
  # search page via the 'data-bundle-path' attribute. Relative to the
  # search page URL, so it works both locally and under the GitHub
  # Pages '/projektemacher-base/' subpath (the default '/index/' only
  # works for deployments at a domain root). Generated by
  # 'pagefind-indexer -c ../pagefind-index.yaml' (CI) or the same
  # command run manually in this directory.
  searchBundlePath = '../index/'
  # Favicons, generated from the theme's 'static/images/cm.svg' via
  # '../scripts/favicon.sh' (the same source the live projektemacher.org
  # site uses)
  favicon_32 = 'images/favicon-32.png'
  favicon_16 = 'images/favicon-16.png'
  favicon_svg = 'images/cm.svg'

[params.author]
  email = 'mail@christianmahnke.de'
  name = 'Christian Mahnke'
  uri = 'http://www.wikidata.org/entity/Q137668638'

[params.webmentions]
  # Webmention/pingback collector endpoint (see the theme's
  # 'services/webmentions/README.md'). Enabled only when 'endpoint' is
  # set; the mention data itself lives at 'data/webmentions/mentions.json'
  # (site repository, committed by the collection workflow).
  # The theme's own 'hugo.toml' defaults to
  # 'https://static.projektemacher.org/services/webmention.php',
  # overridden here to demo the local example endpoint.
  # endpoint = 'https://webmentions.example.org/endpoint.php'
  advertisePingback = true

[markup.goldmark.renderer]
  unsafe = true

[imaging]
    [imaging.jpeg]
        quality = 95
    [imaging.webp]
        quality = 95
    [imaging.avif]
        quality = 95

[mediaTypes]
  [mediaTypes."application/x-qrcode-template"]
    suffixes = ["json"]
  [mediaTypes."application/ld+json"]
    suffixes = ["json"]
  [mediaTypes."model/gltf-binary"]
    suffixes = ["glb"]

[outputFormats]
  [outputFormats.qrcode]
    mediaType = "application/x-qrcode-template"
    isPlainText = true
    isHTML = false
    baseName = "qrcode"
    notAlternative = true
  [outputFormats.iiif-manifest]
    mediaType = "application/ld+json"
    baseName = "manifest"
    isPlainText = true
    isHTML = false
  [outputFormats.iiif-collection]
    mediaType = "application/ld+json"
    baseName = "collection"
    isPlainText = true
    isHTML = false

[outputs]
  home = ["html", "iiif-collection"]

[module]
  # Expose the theme's i18n files as data for the 'i18n strings' page
  # (see content/i18n and layouts/shortcodes/i18n-strings.html)
  [[module.mounts]]
    source = '../i18n'
    target = 'data/i18n'
  # Defining mounts replaces the implicit defaults - keep the site's
  # own data directory mounted for the webmentions JSON (see
  # content/posts/webmentions)
  [[module.mounts]]
    source = 'data'
    target = 'data'

[security]
  # Allow HTML files in content bundles, needed by the html-body template
  allowContent = ['^text/html$', '^text/markdown$']
  [security.http]
    mediaTypes = ['^application/json$', '^application/json;\s?charset=[uU][tT][fF]-8$', '^application/sparql-results\+json;\s?charset=[uU][tT][fF]-8$']
  # The theme's asset pipeline imports packages (howler, mermaid, ol, pdfobject,
  # tify, …) from the node_modules directory of the theme repository one level up
  [security.node]
    [security.node.permissions]
      # NOTE: setting 'allowRead' REPLACES the default ['.'] — the working
      # directory and the project root must stay in the list, since Node's CJS
      # resolver and Browserslist walk up the directory tree reading
      # 'package.json' and config candidates ('browserslist' file). A too
      # narrow list breaks css.PostCSS with 'Error: Access to this API has
      # been restricted. Use --allow-fs-read to manage permissions.'
      allowRead = ['.', '..', '../node_modules']

# Multilingual Language Configurations
[languages]
  [languages.en]
    locale = 'en'
    label = 'English'
    weight = 1
    contentDir = 'content'
  [languages.de]
    locale = 'de'
    label = 'Deutsch'
    weight = 2
    contentDir = 'content/de'

# Main navigation: link all content sections
# Note: URLs must be absolute (including the baseURL path), since Hugo's
# 'absURL'/'absLangURL' drop the baseURL path for root-relative URLs
