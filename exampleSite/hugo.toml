[[languages.en.menu.main]]
  name = 'Wikidata'
  pageRef = 'wikidata'
  weight = 4
[[languages.en.menu.main]]
  name = 'Git'
  pageRef = 'git'
  weight = 5
[[languages.en.menu.main]]
  name = 'Config'
  pageRef = 'config'
