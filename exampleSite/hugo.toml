baseURL = 'https://cmahnke.github.io/projektemacher-base/'
theme = ["projektemacher-base"]
title = "Projektemacher Base"
locale = "en"
defaultcontentlanguage = "en"
publishDir = "docs"
canonifyurls = true
disablePathToLower = true

[params]
  favicon_32 = 'https://cmahnke.github.io/projektemacher-base/images/cm-solid.svg'
  favicon_16 = 'https://cmahnke.github.io/projektemacher-base/images/cm-solid.svg'

[params.author]
  email = 'mail@christianmahnke.de'
  name = 'Christian Mahnke'
  uri = 'http://www.wikidata.org/entity/Q137668638'

[markup.goldmark.renderer]
  unsafe = true

[imaging]
    quality = 95

[mediaTypes]
  [mediaTypes."application/x-qrcode-template"]
    suffixes = ["json"]
  [mediaTypes."application/ld+json"]
    suffixes = ["json"]

[outputFormats]
  [outputFormats.qrcode]
    mediaType = "application/x-qrcode-template"
    isPlainText = true
    isHTML = false
    baseName = "qrcode"
    notAlternative = true
  [outputFormats.iiif-manifest]
    mediaType = "application/ld+json"
    baseName = "manifest"
    isPlainText = true
    isHTML = false

[security]
  [security.http]
    mediaTypes = ['^application/json$', '^application/json;\s?charset=[uU][tT][fF]-8$', '^application/sparql-results\+json;\s?charset=[uU][tT][fF]-8$']

# Multilingual Language Configurations
[languages]
  [languages.en]
    locale = 'en'
    label = 'English'
    weight = 1
    contentDir = 'content'
  [languages.de]
    locale = 'de'
    label = 'Deutsch'
    weight = 2
    contentDir = 'content/de'

# Main navigation: link all content sections
# Note: URLs must be absolute (including the baseURL path), since Hugo's
# 'absURL'/'absLangURL' drop the baseURL path for root-relative URLs
[[languages.en.menu.main]]
  name = 'IIIF'
  url = 'https://cmahnke.github.io/projektemacher-base/iiif/'
  weight = 1
[[languages.en.menu.main]]
  name = 'Shortcodes'
  url = 'https://cmahnke.github.io/projektemacher-base/shortcodes/'
  weight = 2
[[languages.en.menu.main]]
  name = 'Posts'
  url = 'https://cmahnke.github.io/projektemacher-base/posts/'
  weight = 3
[[languages.en.menu.main]]
  name = 'Wikidata'
  url = 'https://cmahnke.github.io/projektemacher-base/wikidata/'
  weight = 4
[[languages.en.menu.main]]
  name = 'Git'
  url = 'https://cmahnke.github.io/projektemacher-base/git/'
  weight = 5
[[languages.en.menu.main]]
  name = 'Config'
  url = 'https://cmahnke.github.io/projektemacher-base/config/'
  weight = 6
[[languages.en.menu.main]]
  name = 'Todo'
